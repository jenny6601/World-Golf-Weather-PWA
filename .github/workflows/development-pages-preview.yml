name: Deploy development preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'data/**'
      - 'icons/**'
      - '.github/workflows/development-pages-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-development-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Prepare static preview
        run: |
          mkdir -p _site
          cp index.html manifest.json _site/
          cp -R data icons _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@v4
