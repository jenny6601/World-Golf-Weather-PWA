name: Build development static preview artifact

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'data/**'
      - 'icons/**'
      - 'assets/**'
      - '.github/workflows/development-pages-preview.yml'

permissions:
  contents: read

concurrency:
  group: github-pages-development-preview-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5

      - name: Prepare static preview
        run: |
          mkdir -p _site
          cp index.html manifest.json _site/
          cp -R data icons _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll

      - name: Upload preview artifact (no Pages deployment)
        uses: actions/upload-artifact@v6
        with:
          name: world-golf-weather-development-preview
          path: _site
          if-no-files-found: error
          retention-days: 7
