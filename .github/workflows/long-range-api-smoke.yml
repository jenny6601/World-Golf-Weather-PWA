name: Long-range forecast API smoke test

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'scripts/test-long-range-api.mjs'
      - '.github/workflows/long-range-api-smoke.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  seasonal-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify EC46 46-day and SEAS5 monthly APIs
        run: node scripts/test-long-range-api.mjs
