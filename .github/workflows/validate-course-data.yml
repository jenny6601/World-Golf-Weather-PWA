name: Validate course database
on:
  push:
    branches: [development, main]
    paths:
      - "data/courses/**"
      - "data/schemas/**"
      - "index.html"
      - "manifest.json"
      - "scripts/**"
      - ".github/workflows/validate-course-data.yml"
  pull_request:
    branches: [development, main]
    paths:
      - "data/courses/**"
      - "data/schemas/**"
      - "index.html"
      - "manifest.json"
      - "scripts/**"
      - ".github/workflows/validate-course-data.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate course records, search aliases and PWA shell
        run: node scripts/validate-course-data.mjs
      - name: Check provider cache builder syntax
        run: node --check scripts/build-provider-cache.mjs
